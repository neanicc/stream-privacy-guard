SPG.FilterName="Privacy Guard"
SPG.Description="Covers sensitive content on a source before it airs. A safety net, not a guarantee."
SPG.Status="Detection models are not loaded by this build yet, so the filter fails closed: every frame airs after the lookahead delay covered whole by the fallback below (a blur of the whole source by default). Nothing unscanned airs uncovered."
SPG.Render.Aired="Frames aired since the filter started:"
SPG.Render.Masked="with only detected regions masked"
SPG.Render.Covered="covered whole by the fallback."
SPG.Render.Last="Last reason:"
SPG.Audio="Audio: this filter delays the video by the Lookahead time but cannot delay audio. In Edit > Advanced Audio Properties, set Sync Offset to the same number of milliseconds on every audio source that belongs with this video (this source's own audio, your microphone, desktop audio), or they will be ahead of the picture."
SPG.Issue.NoCategories="Every category is off, so the filter covers the whole source. To stop filtering, hide or remove the filter instead."
SPG.Issue.InvalidConfig="These settings could not be applied, so the filter covers the whole source."
