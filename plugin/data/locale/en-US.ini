SPG.FilterName="Privacy Guard"
SPG.Description="Covers sensitive content on a source before it airs. A safety net, not a guarantee."
SPG.Status="Detection is not part of this build yet. The filter fails closed: it covers the whole source with an opaque fill so nothing unscanned airs. Settings below are saved but not used yet."
SPG.Issue.NoCategories="Every category is off, so the filter covers the whole source. To stop filtering, hide or remove the filter instead."
SPG.Issue.InvalidConfig="These settings could not be applied, so the filter covers the whole source."
